const posts=[
{id:'easy-granny-square-market-tote',title:'Easy Granny Square Market Tote',category:'Crochet Bags',level:'Easy',date:'September 8, 2026',image:'./assets/granny-square-tote.webp',excerpt:'Turn a stack of classic granny squares into a roomy everyday tote with simple joins and sturdy crochet handles.',content:`<p>This cheerful granny square market tote combines one of crochet's most familiar motifs with a practical everyday bag shape. It is a good project for crocheters who are comfortable making basic granny squares and want to practice blocking, joining and finishing without moving into complicated garment shaping. The modular construction also makes the project easy to work on in short sessions because each square can be completed separately before the bag is assembled.</p><div class="callout"><strong>Project idea:</strong> Keep the palette limited to two or three colors so the finished tote feels coordinated. Cream, muted sage and dusty rose create a soft vintage look, but the same construction works with brighter scraps or a single-color palette.</div><h2>Materials and yarn choice</h2><p>Worsted-weight cotton is a strong choice for a market tote because it gives the squares clear stitch definition and usually stretches less than a very soft acrylic yarn. A cotton blend can also work if you want the fabric to feel a little lighter. Use a hook size that creates a firm but flexible square; for many worsted-weight yarns, a 4.5 to 5 mm hook is a useful starting point. You will also need a yarn needle, scissors and a few removable stitch markers for keeping the panels aligned during joining.</p><h2>Planning the granny squares</h2><p>Make all of the squares to the same finished dimensions rather than relying only on the same number of rounds. Small tension differences can add up once several motifs are joined. A classic square can begin with a center ring and build outward in groups of double crochet separated by chain spaces. If you are changing colors, carry out the changes at consistent rounds so the overall bag looks intentional.</p><p>Before joining, weave in the loose ends and block the squares. Light wet blocking is usually enough for cotton. Shape each motif into a neat square and allow it to dry completely. Blocking makes the seams easier to match and gives the finished tote a cleaner professional appearance.</p><h2>Construction overview</h2><p>Arrange the motifs on a table before sewing or crocheting them together. Build a front panel and a matching back panel, then use additional squares along the sides and base to create depth. The exact number of motifs can be adjusted depending on the square size and how roomy you want the bag to be. Join the squares with a slip-stitch seam, single crochet join or mattress-style sewn seam. Keep the join consistent across the whole project.</p><h2>Top edge and handles</h2><p>Once the body is assembled, work one or more firm rounds around the entire upper opening. This border stabilizes the joined squares and gives you a clean foundation for the handles. Mark the handle positions before crocheting them so they are centered on the front and back. A dense single crochet or half double crochet handle is usually sturdier than an open decorative stitch. Make both handles the same length and reinforce the attachment areas with an additional round or a few hidden stitches.</p><h2>Finishing and care</h2><p>Check every seam and weave in any remaining tails through several directions so they stay secure with use. If the tote will carry heavier groceries or books, consider adding a simple fabric lining to reduce stretching. Hand washing and reshaping while damp will generally help the bag keep its form. Once finished, the result is a roomy handmade tote that still clearly shows the charm of the individual granny squares.</p>`},
{id:'soft-daisy-granny-square-throw',title:'Soft Daisy Granny Square Throw',category:'Crochet Blankets',level:'Easy–Intermediate',date:'September 6, 2026',image:'./assets/daisy-granny-blanket.webp',excerpt:'A calm sage-and-cream throw built from simple floral squares with raised daisy centers.',content:`<p>This soft daisy granny square throw uses a repeating floral motif to create a cozy blanket with a calm cottage-inspired look. The project is especially satisfying for crocheters who enjoy making motifs one at a time because each square feels like a small finished piece. When the squares are finally joined, the repeated flowers create a much larger design without requiring difficult shaping or long rows of stitches.</p><h2>Choosing the yarn and palette</h2><p>A smooth worsted or light worsted yarn works well because it shows the petals and the square structure clearly. For the photographed version, a warm yellow center, white petals, soft sage background and cream joining yarn create a gentle neutral palette. You can substitute colors, but keeping the flower centers and petals consistent across all motifs helps the blanket look balanced. If the throw will be used frequently, choose yarn that can be washed easily and feels comfortable against the skin.</p><h2>Building the daisy motif</h2><p>Start each motif at the flower center. The center can be worked as a small circle before the petals are formed around it. The white petal round should create distinct raised shapes while still leaving enough space for the motif to transition into a square. After the flower is complete, use the background color to fill the spaces between petals and establish four clear corners. From that point, additional rounds can enlarge the motif while preserving the square shape.</p><div class="callout"><strong>Consistency matters:</strong> Measure every few motifs. Even a small difference in tension becomes more visible after dozens of squares are joined together.</div><h2>Making a consistent set</h2><p>Work from the same yarn weights and hook size for every square. Count the stitches and corner spaces carefully, especially when changing from the flower to the square background. It can help to make five or six motifs first, block them and confirm that you like the size before committing to the full blanket. If one square is noticeably smaller or larger, correcting it early is easier than forcing it into place during assembly.</p><h2>Blocking before assembly</h2><p>Blocking is one of the most useful steps in a motif blanket. Gently dampen the squares, shape them to the same measurements and allow them to dry flat. The process opens the stitches, relaxes small tension differences and makes the edges easier to line up. Avoid overstretching the flower centers because you want the petals to remain slightly raised and dimensional.</p><h2>Arranging and joining</h2><p>Lay all blocked squares on a large surface and experiment with the arrangement before joining. Because the motifs are visually similar, the main goal is to distribute any subtle color or tension variations evenly. Join the squares in rows with cream yarn using a method you enjoy, such as slip stitches, single crochet or a neat sewn seam. Keep the joining tension relaxed enough that the blanket remains flat.</p><h2>Border and finishing</h2><p>After all rows are connected, work a narrow cream border around the entire blanket. One or two simple rounds are enough to frame the floral field without competing with the daisies. Pay special attention to the corners so they stay flat rather than cupping. Weave in every tail securely, then give the completed throw a final gentle block. The finished blanket should feel soft, flexible and cohesive, with the small raised daisies providing just enough texture to make the repeated granny-square construction feel special.</p>`},
{id:'no-sew-mini-puppy-amigurumi',title:'No-Sew Mini Puppy Amigurumi',category:'Amigurumi',level:'Beginner',date:'September 3, 2026',image:'./assets/mini-puppy-amigurumi.webp',excerpt:'A palm-sized puppy made with a compact body, integrated legs and simple floppy ears.',content:`<p>This no-sew mini puppy amigurumi is designed as a quick, compact project with as few separate pieces as possible. The rounded body, tiny legs and simple floppy ears give it a friendly puppy shape without requiring a large amount of assembly. Because the toy is small, it is also a useful project for leftover yarn and for practicing tight single crochet, increases, decreases and simple shaping.</p><h2>Yarn, hook and stuffing</h2><p>Smooth cotton or acrylic yarn is easier to control than fuzzy novelty yarn when working at this scale. Choose a hook slightly smaller than you might use for a flat crochet project so the fabric is dense enough to contain the stuffing. The exact hook size depends on the yarn, but the goal is to avoid visible gaps between stitches. You will need a small amount of fiberfill, a yarn needle for finishing details and either safety eyes or embroidery thread for the face.</p><h2>Working the body in continuous rounds</h2><p>Amigurumi is commonly worked in a spiral rather than joining each round. Place a stitch marker in the first stitch and move it upward as you work. Start with a small magic ring, increase evenly to create the rounded head or upper body, then work several even rounds before beginning the shaping. Controlled decreases can narrow the form again. Stuff gradually rather than waiting until the opening is very small, because even distribution is easier when you still have access to the inside.</p><h2>Creating integrated legs</h2><p>The no-sew concept works best when the short legs are formed directly from the body instead of being made separately and attached later. Depending on the construction, small groups of stitches can be worked to create four compact feet or leg bumps. Keep them short so the puppy remains stable and proportional. Before closing the body, set the toy on a flat surface and check that the legs allow it to sit or stand without leaning strongly to one side.</p><h2>Ears and color details</h2><p>Small floppy ears can be crocheted from the upper sides of the head or worked as minimal pieces that require only a very small attachment area. For the cream-and-caramel version, one caramel ear and a small caramel eye patch add character without making the design busy. If you add a color patch, keep your tension even where the colors change and carry or cut the yarn neatly so the inside remains tidy.</p><div class="callout"><strong>Small-project tip:</strong> Use a removable stitch marker and count frequently. Missing one increase or decrease can change the shape much more noticeably on a miniature toy than on a large project.</div><h2>Face and safety</h2><p>Place the eyes before the head becomes difficult to access from the inside. If the toy is intended for a baby or very young child, embroidered eyes are generally a safer choice than removable plastic components. Add a tiny embroidered nose with dark yarn and keep the expression simple. Avoid long loose strands, beads or detachable accessories on a toy meant for small children.</p><h2>Finishing the puppy</h2><p>Add the final stuffing in small pieces so the body remains rounded rather than lumpy. Close the opening securely and hide the yarn tail inside the toy. Gently shape the puppy with your fingers, adjusting the stuffing around the muzzle, legs and back. The completed amigurumi should feel firm enough to hold its shape but not so tightly stuffed that the stitches are stretched apart. This little project is fast enough for gifts, market-table extras or a playful addition to a crochet collection.</p>`},
{id:'strawberry-drawstring-pouch',title:'Strawberry Drawstring Pouch',category:'Crochet Accessories',level:'Beginner',date:'August 31, 2026',image:'./assets/strawberry-drawstring-pouch.webp',excerpt:'A small red drawstring pouch with a green top edge and subtle stitched seeds.',content:`<p>This strawberry drawstring pouch turns a very simple crochet bag shape into a playful accessory through color and finishing. The rounded red body, green top edge and small cream seed stitches suggest a strawberry without requiring complicated shaping. It is a useful size for jewelry, earbuds, coins, stitch markers or other small items, and the project is compact enough to make from leftover yarn.</p><h2>Choosing yarn and hook</h2><p>A smooth cotton yarn is a practical choice because it gives the pouch enough structure to stand upright and shows the stitches clearly. Acrylic can also work, especially if you prefer a softer feel. Choose a red or strawberry shade for the body, green for the leafy edge and a small amount of cream or pale yellow for the seeds and drawstring. Use a hook that creates a fairly dense fabric so tiny objects are less likely to push through the stitches.</p><h2>Starting with the base</h2><p>Begin the pouch with a flat circular base. Work increases evenly around the circle so it stays flat rather than forming a bowl too early. Stop increasing when the base reaches the width you want for the finished pouch. A palm-sized base creates a useful small accessory, but the same idea can be enlarged if you want a pouch for cosmetics or craft supplies.</p><h2>Building the sides</h2><p>Once the base is wide enough, continue in rounds without increases. The fabric will naturally turn upward and create the walls. Keep your tension consistent so the body rises evenly. You can use single crochet for a firm surface or another compact stitch if you prefer more texture. Work until the red section has enough height to hold the intended items while still leaving room for the green top treatment.</p><h2>Creating the drawstring openings</h2><p>Near the upper edge, create a round with evenly spaced chain openings. These spaces need to be large enough for the cord to slide through but not so large that the edge becomes floppy. Count the openings and distribute them evenly around the pouch. After the eyelet round, work one stabilizing round before adding the decorative green edge.</p><h2>Green strawberry top</h2><p>The green edge can be made with small scallops or leaf-like points. Keep the shapes simple and evenly spaced. The goal is to suggest the leafy cap of a strawberry while preserving a practical opening. If the scallops curl too much, reduce the number of stitches in each section; if they pull the top inward too tightly, loosen the tension or add a little more spacing.</p><div class="callout"><strong>Clean finish:</strong> Keep the seed decoration sparse. A few well-placed stitches usually read more clearly as strawberry seeds than covering the entire pouch with embroidery.</div><h2>Making and inserting the cord</h2><p>Crochet a simple chain cord, twisted cord or narrow braided cord in cream. Make it long enough to travel around the pouch with extra length for tying. Thread it through the openings, alternating in and out around the circumference. Pull both ends together to test that the pouch closes smoothly. Secure the cord ends with knots or small finished tips so they do not pull back through the holes.</p><h2>Adding seeds and finishing</h2><p>Use a yarn needle to make short cream stitches across the red surface. Place them irregularly but evenly enough that the design feels balanced. Weave every tail into the inside of the pouch and trim carefully. A light block can help the base sit flat, although heavy blocking is unnecessary. The final pouch is quick, practical and recognizable, making it a good small gift or stash-busting project.</p>`},
{id:'boho-crochet-flower-headband',title:'Boho Crochet Flower Headband',category:'Crochet Wearables',level:'Easy',date:'August 29, 2026',image:'./assets/boho-flower-headband.webp',excerpt:'A slim crochet band decorated with three small five-petal flowers in soft vintage colors.',content:`<p>This boho crochet flower headband is a small wearable project that combines a slim comfortable band with three simple five-petal flowers. It is ideal for using short lengths of leftover yarn because the flowers require very little material and can be made in coordinating colors. The finished style works well with soft vintage shades, but the construction is flexible enough for bright summer colors, neutrals or a single-color version.</p><h2>Choosing yarn for comfort</h2><p>Select a smooth yarn that feels comfortable against the forehead and behind the ears. Cotton and soft cotton blends are good options because they provide clear stitch definition without excessive fuzz. A lightweight worsted or DK yarn keeps the band from becoming bulky. For the pictured palette, use sage green for the band and dusty rose, warm cream and muted mustard for the flowers.</p><h2>Measuring the band</h2><p>Headband sizing depends on both head circumference and yarn stretch. Measure around the head where the band will sit, then make the crochet strip slightly shorter so it can stretch gently into place. You want a secure fit without pressure. If you are making the project as a gift and cannot measure the wearer, use a standard size chart as a guide but keep the join easy to adjust before final finishing.</p><h2>Crocheting a narrow strip</h2><p>The band can be worked lengthwise in a few rows of single crochet, half double crochet or another compact stitch. Keep the edges neat because they remain visible in the finished accessory. If you prefer more stretch, work some stitches through the back loop or choose a ribbed construction. Test the fabric by pulling it gently; it should recover without becoming loose or distorted.</p><h2>Making the flowers</h2><p>Each flower can begin with a small center ring. Form five petals around the center using short combinations of chains and taller stitches. Keep all three flowers approximately the same diameter even if the colors are different. The compact five-petal shape is easier to attach than a very layered flower and is less likely to feel heavy when worn.</p><div class="callout"><strong>Placement tip:</strong> Arrange the flowers on the finished band before sewing. Slightly overlapping the edges can create a fuller cluster, while leaving a little space between them gives a lighter and simpler look.</div><h2>Joining the band</h2><p>Before closing the band, wrap it around the intended wearer or a sizing form. Adjust the length if necessary. Join the two short ends with a neat seam that lies flat. If the seam feels bulky, use a yarn needle and mattress-style stitches rather than crocheting through several thick layers. Position the seam at the back of the headband where it will be least noticeable.</p><h2>Attaching the flowers securely</h2><p>Place the flowers at the front or slightly off-center, depending on the look you prefer. Sew through the center and a few inner petal points rather than stitching around every outer edge. This keeps the petals free and dimensional while preventing the flowers from rotating. Hide all yarn tails inside the stitches of the band.</p><h2>Final shaping and variations</h2><p>A small amount of steam or gentle wet blocking can help the strip lie evenly and the petals open. Do not stretch the band to its maximum size while blocking because you want it to retain elasticity. Once you are comfortable with the basic design, try two larger flowers, several tiny flowers or a neutral monochrome version. The simple construction makes this headband a useful base for many color combinations while still remaining quick and beginner-friendly.</p>`},
{id:'sage-green-crochet-hobo-bag',title:'Sage Green Crochet Hobo Bag',category:'Crochet Bags',level:'Intermediate',date:'August 26, 2026',image:'./assets/sage-hobo-bag.webp',excerpt:'A softly slouchy shoulder bag with a wide integrated strap and dense practical stitch texture.',content:`<p>This sage green crochet hobo bag uses a softly curved body and a wide integrated shoulder strap to create a relaxed everyday silhouette. Unlike a bag assembled from many separate motifs, the focus here is continuous shaping and a dense stitch texture. The design is simple in appearance, but careful increases, decreases and strap placement make it a satisfying intermediate project for crocheters who want to practice creating form.</p><h2>Yarn for a structured but soft bag</h2><p>Cotton or a cotton-blend yarn works especially well because it offers strength and stitch definition while still allowing the body to drape. A very stretchy acrylic yarn can produce a softer bag, but it may lengthen more once the bag is filled. Choose a muted sage shade for the calm look shown here, or use any solid color that highlights the stitch texture. A matching yarn makes the integrated strap look especially clean.</p><h2>Choosing a dense stitch</h2><p>A hobo bag needs enough density that small objects do not easily push through the fabric. Single crochet, linked stitches or another compact textured stitch can work well. Make a small swatch before starting and stretch it in both directions. If the holes open too widely, go down a hook size or choose a denser stitch pattern. The fabric should remain flexible enough to form the characteristic slouch without feeling stiff like a basket.</p><h2>Shaping the body</h2><p>The crescent silhouette comes from gradual shaping rather than abrupt corners. Begin with the lower section and increase in a controlled way to create width. Work even sections through the broadest part of the bag, then introduce decreases as the sides move toward the upper opening. Keep notes on each shaping row or round so the left and right sides remain balanced.</p><h2>Creating the integrated strap</h2><p>Instead of sewing on a separate handle, continue the upper edges into a wide strap. A broad strap distributes the weight more comfortably across the shoulder and matches the casual hobo shape. Check the strap length as you work; remember that cotton can relax slightly with use and other fibers may stretch even more. It is usually better to make the strap a little shorter than an unstretched measurement would suggest.</p><div class="callout"><strong>Optional upgrade:</strong> Add a fabric lining after the crochet portion is complete if you want to carry keys, cosmetics or other small items without stretching the stitches.</div><h2>Strengthening stress points</h2><p>The areas where the strap transitions into the body receive the most strain. Work these sections firmly and avoid loose chain spaces. You can reinforce the inside with an additional row of slip stitches or a discreet second strand of yarn. If the bag opening begins to stretch, a final round of tighter single crochet around the top can help stabilize it.</p><h2>Adding a lining</h2><p>A lining is optional but useful. Cut fabric slightly larger than the finished bag interior, sew the fabric pieces together, fold the upper edge neatly and hand-stitch the lining to the inside of the crochet opening. Keep the lining loose enough that it does not pull on the crocheted body. A small interior pocket can also be added before the lining is installed.</p><h2>Finishing and everyday care</h2><p>Weave in all ends carefully, especially around the strap. Gently block the bag into its curved shape without flattening the texture. When washing, follow the yarn label and support the bag while drying so the weight of wet yarn does not stretch the strap. The result is an understated, practical crochet shoulder bag that works with casual outfits while still showing the texture and craftsmanship of handmade fabric.</p>`},
{id:'simple-vintage-lace-doily',title:'Simple Vintage Lace Doily',category:'Crochet Home',level:'Intermediate',date:'August 23, 2026',image:'./assets/lace-doily.webp',excerpt:'A round ivory doily with repeated open arches and a crisp scalloped edge.',content:`<p>This simple vintage lace doily uses repeated open arches and a scalloped outer edge to create the look of traditional thread crochet without relying on an overwhelming number of stitch types. The project is best suited to a crocheter who is comfortable counting repeats and working in rounds. The finished piece can be used under a vase, displayed on a side table or framed as decorative crochet.</p><h2>Thread and hook selection</h2><p>Traditional doilies are often made with cotton crochet thread because it produces crisp lace and holds blocking well. Choose a warm ivory or cream for a classic look. The hook should be small enough to create tidy stitches but comfortable enough that you can maintain even tension. If thread crochet is new to you, a slightly thicker cotton can make the first attempt easier while still preserving the lace effect.</p><h2>Starting from the center</h2><p>Begin with a small ring and work the first round into that center. The early rounds establish the circular shape, so count carefully and make sure the stitches are distributed evenly. Mark the beginning of each round if the pattern structure makes it difficult to see. Small mistakes near the center multiply as the piece grows, so it is worth correcting them before continuing.</p><h2>Building the lace repeats</h2><p>As the doily expands, solid sections can alternate with chain spaces and arches. These open spaces are what give lace its delicate appearance. Keep the chain tension consistent; chains that are much tighter or looser than the surrounding stitches can distort the circle. When a round contains repeated groups, count the groups at the end rather than assuming the final join means everything is correct.</p><div class="callout"><strong>Accuracy tip:</strong> If the work begins to cup, you may have too few increases or the tension may be too tight. If it starts to ruffle strongly, there may be too many stitches or too much looseness in the chain spaces.</div><h2>Creating the scalloped edge</h2><p>The outer rounds can transition into repeated arches and scallops. Work each scallop with the same stitch count so the circumference remains symmetrical. The edge may look slightly uneven directly off the hook, which is normal for lace. Blocking will open the arches and define each point or curve much more clearly.</p><h2>Weaving in fine-thread ends</h2><p>Secure the starting and finishing tails carefully. Thread ends can be more noticeable in open lace than in dense crochet, so weave them through solid sections where possible. Change direction once or twice rather than pulling a tail through one straight path. Trim only after you are confident the end will not work loose.</p><h2>Blocking the finished doily</h2><p>Blocking is essential for this project. Dampen the finished piece according to the yarn or thread care instructions, then place it on a blocking mat or protected surface. Pin the center first, then work outward around the circumference. Measure from the center to several points so the circle remains even. Shape every scallop individually and use enough pins to prevent the edge from shrinking back while drying.</p><h2>Displaying and caring for lace</h2><p>Allow the doily to dry completely before removing the pins. If it will sit under an object, choose something with a smooth base that will not snag the stitches. For storage, lay the piece flat or roll it gently rather than folding it sharply. With careful blocking and handling, the finished doily has a crisp, balanced vintage appearance while remaining an approachable introduction to decorative lace crochet.</p>`},
{id:'heart-granny-square-pillow',title:'Heart Granny Square Pillow',category:'Crochet Home',level:'Easy–Intermediate',date:'August 20, 2026',image:'./assets/heart-granny-pillow.webp',excerpt:'A cozy square pillow featuring one large dusty-rose heart motif and a simple sage border.',content:`<p>This heart granny square pillow turns a bold crochet motif into a practical home accessory. The front panel features a dusty-rose heart worked into a cream square, finished with a narrow sage border. Instead of sewing a separate heart appliqué onto the surface, the color changes are incorporated into the crochet fabric, which gives the motif a flatter and more integrated appearance.</p><h2>Planning the pillow size</h2><p>Choose the pillow insert before you finish the crochet panels. Common throw-pillow sizes are easy to find, and working toward a known measurement makes the final assembly simpler. Crochet fabric has some stretch, so the finished panel can be slightly smaller than the insert for a plump result. Make a small gauge swatch if the exact size matters, especially if you are substituting yarn or changing hook size.</p><h2>Yarn and color choices</h2><p>A smooth worsted-weight yarn provides enough body for a pillow while showing the motif clearly. Use cream for the main background, dusty rose for the heart and sage for the border if you want the soft palette shown here. Three colors are enough to create contrast without making the design busy. For a more graphic version, use a dark background and a bright heart, or keep everything tonal with closely related shades.</p><h2>Working the heart into the front panel</h2><p>The heart can be created with planned color changes as the square grows. Keep the unused yarn controlled on the wrong side or fasten off cleanly when a color section ends. The heart should remain centered as the surrounding cream area expands. Count the stitches on both sides of the motif so the front panel stays symmetrical and the heart does not drift toward one edge.</p><div class="callout"><strong>Color-change tip:</strong> Complete the final yarn-over of the stitch before a color change with the new color. This usually creates a cleaner boundary between the heart and the background.</div><h2>Squaring and bordering the front</h2><p>Continue working outward until the front panel reaches the required dimensions. A narrow sage border frames the design and gives you a consistent edge for assembly. Check that all four sides contain the same number of stitches and that the corners lie flat. If the panel curls, a light block before joining can make the edges much easier to match.</p><h2>Making the back panel</h2><p>The back can be a plain solid square or a simple granny-style panel in cream. A solid back gives the pillow a cleaner appearance and helps contain the insert. Match the dimensions of the front panel carefully. If you want a removable cover, divide the back into two overlapping rectangles to create an envelope opening rather than closing all four sides permanently.</p><h2>Joining the pillow</h2><p>Place the panels with the correct sides facing outward if you plan to use a decorative single crochet join, or right sides together if you prefer a hidden sewn seam. Join three sides first, insert the pillow form and check that the corners are filled evenly. Close the final side carefully. For a removable envelope-style cover, assemble the back opening before joining the outer edges.</p><h2>Finishing and styling</h2><p>Weave in all yarn tails securely and gently shape the pillow. Avoid aggressive blocking after the insert is inside. The completed piece works well alone on a neutral chair or mixed with simple solid cushions. Because the motif is large and centered, it reads clearly from across a room while still showing the handmade texture up close. The same construction can also be adapted to stars, flowers, initials or other simple color motifs once you are comfortable planning the front panel.</p>`}

function renderHome(){document.getElementById("app").innerHTML=`<div class="wrap"><section class="hero"><div><span class="eyebrow">✦ Modern crochet, made approachable</span><h1>Small stitches.<br>Big cozy energy.</h1><p>Discover charming crochet projects with practical construction, soft color palettes and beginner-friendly ideas you’ll actually want to make.</p><div class="hero-actions"><a class="btn btn-primary" onclick="showPatterns()">Browse patterns</a><a class="btn btn-secondary" onclick="navigate('page','about')">About Loopberry</a></div></div><div class="hero-image"><img src="./assets/hero-crochet-studio.webp" alt="Cozy crochet studio with yarn and granny square"></div></section><section id="patterns"><div class="section-head"><div><span class="eyebrow">Fresh from the yarn basket</span><h2>Latest crochet ideas</h2></div><p>Simple, polished projects for bags, granny squares, amigurumi, blankets and cozy home décor.</p></div><div class="grid">${posts.map(cardTemplate).join("")}</div></section></div>`;window.scrollTo(0,0)}
function cardTemplate(p){return `<article class="card" onclick="navigate('post','${p.id}')"><img src="${p.image}" alt="${p.title}" onerror="this.style.opacity='.18'"><div class="card-body"><div class="meta"><span class="pill">${p.category}</span><span class="pill">${p.level}</span></div><h3>${p.title}</h3><p>${p.excerpt}</p><div class="card-footer"><div class="author"><img src="${avatar}" alt=""> Loopberry Studio</div><span class="read">Read →</span></div></div></article>`}
function renderPost(id){const p=posts.find(x=>x.id===id);if(!p){renderNotFound();return}document.getElementById("app").innerHTML=`<div class="wrap page"><a class="back" onclick="navigate('home')">← Back to all patterns</a><article class="article-shell"><div class="article-hero"><div class="meta"><span class="pill">${p.category}</span><span class="pill">${p.level}</span><span class="pill">${p.date}</span></div><h1>${p.title}</h1><div class="author"><img src="${avatar}" alt=""> Written by Loopberry Studio</div></div><img class="article-main-image" src="${p.image}" alt="${p.title}"><div class="article-content">${p.content}</div></article></div>`;window.scrollTo(0,0)}
function renderPage(id){const p=pages[id];if(!p){renderNotFound();return}document.getElementById("app").innerHTML=`<div class="wrap page"><a class="back" onclick="navigate('home')">← Back to patterns</a><section class="legal"><h1>${p.title}</h1>${p.body}</section></div>`;window.scrollTo(0,0)}
function renderNotFound(){document.getElementById("app").innerHTML=`<div class="wrap"><div class="empty"><h2>Page not found</h2><p>The project you requested does not exist.</p><button class="btn btn-primary" onclick="navigate('home')">Return home</button></div></div>`}
function showPatterns(){history.replaceState(null,"",window.location.pathname+window.location.search);renderHome();requestAnimationFrame(()=>{const el=document.getElementById("patterns");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})})}
function navigate(view,id=null){if(view==="home"){window.location.hash="";renderHome()}else if(view==="post"){window.location.hash="post/"+id;renderPost(id)}else if(view==="page"){window.location.hash="page/"+id;renderPage(id)}}
window.addEventListener("hashchange",routeFromHash);
function routeFromHash(){const hash=window.location.hash.replace(/^#/,"");if(!hash){renderHome();return}if(hash==="patterns"){renderHome();requestAnimationFrame(()=>{const el=document.getElementById("patterns");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});return}const [type,...rest]=hash.split("/");const id=rest.join("/");if(type==="post")renderPost(id);else if(type==="page")renderPage(id);else renderNotFound()}
routeFromHash();
</script>
